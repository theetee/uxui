<title>SongKrasae Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#151a24; --muted:#5b6475; --line:#e2e5eb;
  --accent:#2747a8; --accent-soft:#e8edfb; --hot:rgba(39,71,168,.18); --hot-line:#2747a8;
  --stage:#e9ebf0; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 28px rgba(16,24,40,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#171b23; --ink:#e8eaf0; --muted:#9aa3b5; --line:#2a303c;
  --accent:#8ea8ff; --accent-soft:#1f2a47; --hot:rgba(142,168,255,.22); --hot-line:#8ea8ff;
  --stage:#0b0d12; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#171b23; --ink:#e8eaf0; --muted:#9aa3b5; --line:#2a303c;
  --accent:#8ea8ff; --accent-soft:#1f2a47; --hot:rgba(142,168,255,.22); --hot-line:#8ea8ff;
  --stage:#0b0d12; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans Thai",-apple-system,"Segoe UI",Tahoma,sans-serif;}
.app{display:grid;grid-template-columns:288px 1fr;height:100%}
aside{min-height:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 14px 28px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .mk{width:34px;height:34px;border-radius:9px;background:#2747a8;color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12px}
.grp{margin:14px 0 4px}
.grp h3{margin:0;padding:0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp h3 span{text-transform:none;letter-spacing:0;font-weight:400}
.it{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:7px 8px;border-radius:8px;cursor:pointer}
.it:hover{background:var(--bg)}
.it[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.it code{font:600 12px/1 ui-monospace,Menlo,monospace;min-width:38px;color:var(--muted)}
.it[aria-current="true"] code{color:var(--accent)}
.it .t{font-size:13.5px}
details.pp{margin:20px 6px 0;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12.5px}
details.pp summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:13px}
details.pp ul{padding-left:16px;margin:8px 0}
main{display:flex;flex-direction:column;min-width:0;height:100%;min-height:0}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.bar .ttl{flex:1;min-width:200px}
.bar .ttl b{font-size:16px}
.bar .ttl b code{font:600 14px ui-monospace,Menlo,monospace;color:var(--accent);margin-right:6px}
.bar .ttl div{color:var(--muted);font-size:12.5px}
.ctl{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.pos{color:var(--muted);font-size:12.5px;min-width:46px;text-align:center}
select.mob{display:none}
.stage{flex:1;overflow:auto;background:var(--stage);padding:28px 24px 60px}
.frame{position:relative;margin:0 auto;box-shadow:var(--shadow);border-radius:10px;overflow:hidden;background:#fff;line-height:0}
.frame.mobile{border-radius:44px}
.frame img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;display:block;border-radius:6px;cursor:pointer;outline:none;transition:background .15s,box-shadow .15s}
.show .hs,.flash .hs,.hs:focus-visible{background:var(--hot);box-shadow:inset 0 0 0 2px var(--hot-line)}
.hs:hover{background:var(--hot)}
.tg{position:absolute;padding:0;margin:0;border:0;background:none;cursor:pointer;border-radius:12px;line-height:0}
.tg img{width:100%;height:100%;display:none}
.tg[aria-pressed="true"] img{display:block}
.show .tg,.flash .tg,.tg:focus-visible{box-shadow:inset 0 0 0 2px var(--hot-line);background:var(--hot)}
.tg:hover{background:var(--hot)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px;line-height:1.5}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  select.mob{display:block;width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .bar{padding:10px 16px;gap:8px}
  .bar .ttl{min-width:0;flex-basis:100%}
  .ctl{width:100%}
  .ctl #hot{margin-right:auto}
  .app,main{max-width:100vw;overflow-x:hidden}
  .stage{padding:16px 16px 40px}
}
.frame{container-type:inline-size}

.si{position:absolute;border:1px solid #7d879a;border-radius:8px;background:#fff;color:#131a29;font-family:"Noto Sans Thai",sans-serif;padding:0 .7em;outline:none;line-height:1}

.sbtn{position:absolute;border:0;border-radius:9px;background:#2747a8;color:#fff;font-family:"Noto Sans Thai",sans-serif;font-weight:500;cursor:pointer}

.stbl{position:absolute;background:#fff;border:1px solid #d3d9e3;border-radius:12px;padding:1em 1.3em 1.3em;font-family:"Noto Sans Thai",sans-serif;color:#131a29;line-height:1.45}
